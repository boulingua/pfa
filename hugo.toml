# ─────────────────────────────────────────────────────────────────────────
# pfa — Persian (Farsi) as a foreign language. Instantiated from the
# canonical boulingua course template `pagegen` (Hugo + hugo-coder).
#
# Only the values the template marks as per-course are changed here; the rest
# is the shared standard and is kept byte-identical to pagegen on purpose.
#
# Chrome and scaffolding prose are English (lingua-franca medium, as in efl/afl);
# Persian is never set as the site language. Every Persian run is wrapped
# per-run with dir="rtl" lang="fa" by the {{< fa >}} / {{< fa-block >}}
# shortcodes, so the page direction stays LTR and bidi stays local.
# ─────────────────────────────────────────────────────────────────────────

baseURL = "https://boulingua.github.io/pfa/"
title = "Persian (Farsi) — S. Le Boulanger"
languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

# Tags are DECLARED, not implicit — derive them from structured fields.
[taxonomies]
  tag = "tags"
  skill = "skills"
  level = "levels"
  topic = "topics"

[params]
  navTitle = "Persian"
  author = "S. Le Boulanger"
  description = "A free, openly-licensed reference course in Modern Persian (Farsi) — a pre-A1 script stage plus CEFR A1 to B1, with units, exams, materials and native-voice audio."
  keywords = "persian,farsi,cefr,rtl,course,oer"
  dateFormat = "2006-01-02"
  since = 2026
  colorScheme = "auto"
  hideCredits = true
  # The colour-scheme toggle is a labelled control in the navbar
  # (layouts/_partials/header.html); disable the theme's floating duplicate
  # so there is exactly one toggle on the page.
  hideColorSchemeToggle = true
  customCSS = ["css/custom.css"]
  # Site code — selects this course's accent from data/accents.yaml
  # (pfa: #B5892B light / #E7C97E dark, hover #8C6A21).
  code = "pfa"
  # Content licence, surfaced by pdf attribution + legal pages.
  license = "CC BY-SA 4.0"
  # Language of the taught content, for the RTL/script layer and for any
  # tooling that needs the BCP-47 tag rather than the site language.
  contentLanguage = "fa"
  contentDirection = "rtl"

  # IMPORTANT — every sub-table under [params] MUST come AFTER all bare
  # [params] keys. TOML scopes everything after a header to that header, so
  # opening [params.plausible] before the keys above would silently move them
  # under params.plausible and leave the site unstyled. Keep this block LAST.
  [params.plausible]
    # Privacy-friendly, cookieless analytics on the author's self-hosted
    # instance (server in Germany) — see /datenschutz/. Leave the domain
    # empty to disable; the head partial is guarded on it.
    domain = "boulingua.github.io/pfa"
    src = "https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/pfa"

# ── Navigation — mirrors content/. ────────────────────────────────────────
